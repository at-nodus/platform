    <g fill="none" stroke="url(#atn)" stroke-width="8" stroke-linecap="square" stroke-linejoin="round">
      <path d="M64 384 L256 448 L256 416"/>
      <path d="M448 128 L256 64 L256 96"/>
      <path d="M160 192 L160 320"/>
      <path d="M352 320 L352 192"/>
    </g>
    <g fill="none" stroke="url(#atn)" stroke-width="4" stroke-linecap="square" stroke-linejoin="round">
