<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="atNodus logo vertical light">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Play:wght@400;700&amp;display=swap");
      .ur { font-family: "Play", "Segoe UI", sans-serif; font-weight: 400; font-style: normal; }
      .ul { font-family: "Play", "Segoe UI", sans-serif; font-weight: 300; font-style: normal; }
      .ub { font-family: "Play", "Segoe UI", sans-serif; font-weight: 700; font-style: normal; }
    </style>
    <linearGradient id="atn" x1="320" y1="192" x2="704" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D7CFF"/>
      <stop offset="25%" stop-color="#4F74FF"/>
      <stop offset="50%" stop-color="#6E68FF"/>
      <stop offset="75%" stop-color="#8D59F5"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="atlogo" x1="280" y1="680" x2="744" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#586BFA"/>
