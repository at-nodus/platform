      <circle cx="448" cy="128" r="24"/>
      <circle cx="64" cy="384" r="24"/>
      <circle cx="448" cy="384" r="24"/>
      <circle cx="160" cy="192" r="16"/>
      <circle cx="160" cy="320" r="16"/>
      <circle cx="352" cy="192" r="16"/>
